AWSTemplateFormatVersion: "2010-09-09"
Description: "Hosts Neon Corsair as a static game — private S3 origin delivered over HTTPS by CloudFront."
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@v3
  com.aws.cloudformation.Context:
    arch: "Private S3 bucket -> CloudFront OAC -> HTTPS browser game."
    must:
      - "Keep S3 public access blocked; grant reads only to this distribution."
      - "Keep bucket data retained if the stack is deleted."
Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: "Private origin for static game assets; S3 website hosting would require a public bucket."
        must:
          - "All four public access blocks remain enabled."
          - "Only CloudFront distribution in this stack may read objects."
          - "Retain game files on stack deletion or bucket replacement."
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Metadata:
      com.aws.cloudformation.Context:
        why: "Signs CloudFront origin requests with SigV4 so the S3 bucket stays private."
        must:
          - "Keep signing behavior always and protocol sigv4."
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-s3-origin"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  SiteResponseHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: "Applies HTTPS transport and browser security headers to every game response."
        must:
          - "Preserve CSP restrictions and HTTPS-only transport."
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-security-headers"
        Comment: "Security headers for Neon Corsair static hosting."
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            ContentSecurityPolicy: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; img-src 'self' data:; font-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'"
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true
          XSSProtection:
            ModeBlock: true
            Override: true
            Protection: true
  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Metadata:
      com.aws.cloudformation.Context:
        why: "Serves the game globally over HTTPS while keeping the S3 origin private."
        must:
          - "Use the private S3 origin access control."
          - "Redirect viewer HTTP requests to HTTPS."
          - "Attach browser security response headers."
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${AWS::StackName} static game"
        DefaultRootObject: index.html
        HttpVersion: http2
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: GameAssets
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref SiteOriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: GameAssets
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref SiteResponseHeaders
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: "Allows only this CloudFront distribution to read objects and rejects insecure transport."
        must:
          - "Keep SourceArn scoped to this distribution."
          - "Keep the HTTPS-only explicit deny."
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOriginRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub "${SiteBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"
Outputs:
  SiteBucketName:
    Description: "Private S3 bucket containing the built game."
    Value: !Ref SiteBucket
  DistributionId:
    Description: "CloudFront distribution used for cache invalidation."
    Value: !Ref SiteDistribution
  GameUrl:
    Description: "Public HTTPS URL for Neon Corsair."
    Value: !Sub "https://${SiteDistribution.DomainName}"
